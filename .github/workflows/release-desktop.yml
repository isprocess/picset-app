name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to rebuild
        required: true
        type: string

run-name: Desktop release ${{ inputs.tag || github.ref_name }}

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PICSET_DESKTOP_WEB_URL: ${{ vars.PICSET_DESKTOP_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assert:release-version
      - run: npm run generate:runtime-config

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
            package_script: package:mac:x64
            artifact_name: picset-desktop-macos-x64
            artifact_paths: |
              release/*.dmg
              release/*.zip
          - id: macos-arm64
            runner: macos-15
            package_script: package:mac:arm64
            artifact_name: picset-desktop-macos-arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip
          - id: windows-x64
            runner: windows-latest
            package_script: package:win:x64
            artifact_name: picset-desktop-windows-x64
            artifact_paths: |
              release/*.exe
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PICSET_DESKTOP_WEB_URL: ${{ vars.PICSET_DESKTOP_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assert:release-version
      - name: Configure optional signing credentials
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.id }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          all_empty() {
            for name in "$@"; do
              if [[ -n "${!name}" ]]; then
                return 1
              fi
            done
            return 0
          }

          all_set() {
            for name in "$@"; do
              if [[ -z "${!name}" ]]; then
                return 1
              fi
            done
            return 0
          }

          decode_base64_to_file() {
            VALUE_NAME="$1" TARGET_PATH="$2" node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              const value = process.env[process.env.VALUE_NAME];
              if (!value) process.exit(1);
              writeFileSync(process.env.TARGET_PATH, Buffer.from(value, "base64"));
            '
          }

          if [[ "$BUILD_TARGET" == macos-* ]]; then
            mac_names=(
              MACOS_CERTIFICATE_P12_BASE64
              MACOS_CERTIFICATE_PASSWORD
              APPLE_API_KEY_P8_BASE64
              APPLE_API_KEY_ID
              APPLE_API_ISSUER_ID
            )

            if all_empty "${mac_names[@]}"; then
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            elif all_set "${mac_names[@]}"; then
              certificate_path="$RUNNER_TEMP/picset-macos-signing.p12"
              api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"

              decode_base64_to_file MACOS_CERTIFICATE_P12_BASE64 "$certificate_path"
              decode_base64_to_file APPLE_API_KEY_P8_BASE64 "$api_key_path"

              {
                echo "CSC_LINK=$certificate_path"
                echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
                echo "APPLE_API_KEY=$api_key_path"
                echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
                echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
              } >> "$GITHUB_ENV"
            else
              echo "::error::macOS signing requires the complete release secret set."
              exit 1
            fi
          fi

          if [[ "$BUILD_TARGET" == windows-* ]]; then
            windows_names=(
              WINDOWS_CERTIFICATE_PFX_BASE64
              WINDOWS_CERTIFICATE_PASSWORD
            )

            if all_empty "${windows_names[@]}"; then
              :
            elif all_set "${windows_names[@]}"; then
              certificate_path="$RUNNER_TEMP/picset-windows-signing.pfx"
              decode_base64_to_file WINDOWS_CERTIFICATE_PFX_BASE64 "$certificate_path"

              {
                echo "WIN_CSC_LINK=$certificate_path"
                echo "WIN_CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
              } >> "$GITHUB_ENV"
            else
              echo "::error::Windows signing requires the complete release secret set."
              exit 1
            fi
          fi
      - run: npm run ${{ matrix.package_script }}
      - name: Verify macOS disk images
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg_files=(release/*.dmg)
          if (( ${#dmg_files[@]} == 0 )); then
            echo "::error::No macOS disk images were generated."
            exit 1
          fi

          for dmg in "${dmg_files[@]}"; do
            hdiutil verify "$dmg"

            mount_dir="$(mktemp -d "$RUNNER_TEMP/picset-dmg.XXXXXX")"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            if [[ ! -d "$mount_dir/PicSet Desktop.app" ]]; then
              hdiutil detach "$mount_dir"
              echo "::error::Disk image $dmg does not contain PicSet Desktop.app."
              exit 1
            fi
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
